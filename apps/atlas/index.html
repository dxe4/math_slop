    <meta name="theme-color" content="#f4f0e8" />
    <script>
      (() => {
        const hosted = document.documentElement.hasAttribute('data-euler-hosted');
        const defaults = { theme: 'system', font: 'serif', textSize: 'medium' };
        const systemPrefersDark = () => typeof matchMedia === 'function' && matchMedia('(prefers-color-scheme: dark)').matches;
        try {
          const raw = localStorage.getItem('math-atlas:reading-preferences');
          const stored = raw && raw.length <= 16384 && new TextEncoder().encode(raw).length <= 16384
            ? JSON.parse(raw) || {} : {};
          const theme = ['light', 'dark', 'system'].includes(stored.theme) ? stored.theme : defaults.theme;
          const font = ['serif', 'sans'].includes(stored.font) ? stored.font : defaults.font;
          const textSize = ['small', 'medium', 'large'].includes(stored.textSize) ? stored.textSize : defaults.textSize;
          const resolved = theme === 'system'
            ? (systemPrefersDark() ? 'dark' : 'light')
            : theme;
          if (!hosted) document.documentElement.dataset.theme = resolved;
          if (!hosted) document.documentElement.dataset.themePreference = theme;
          document.documentElement.dataset.readerFont = font;
          document.documentElement.dataset.readerSize = textSize;
          if (!hosted) document.documentElement.style.colorScheme = resolved;
          if (!hosted) document.querySelector('meta[name="theme-color"]').content = resolved === 'dark' ? '#101a18' : '#f5f1e8';
        } catch {
          const dark = systemPrefersDark();
          if (!hosted) document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          if (!hosted) document.documentElement.dataset.themePreference = defaults.theme;
          document.documentElement.dataset.readerFont = defaults.font;
          document.documentElement.dataset.readerSize = defaults.textSize;
          if (!hosted) document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        }
      })();
    </script>

    <title>Math Atlas — See how mathematics connects</title>
    <script>
      // Static edition: this app serves only the labs (#/labs?lab=…) and About.
      // Its library pages need the Euler server's data, so every other Atlas
      // route opens the matching page of the main site instead.
      (() => {
        const site = '../../index.html#/';
        const target = () => {
          const raw = location.hash.replace(/^#\/?/, '');
          const [path, query = ''] = raw.split('?');
          const parts = path.split('/').filter(Boolean).map(decodeURIComponent);
          const q = new URLSearchParams(query);
          const enc = s => encodeURIComponent(s);
          const [head, a, b] = parts;
          if (head === 'labs' && q.get('lab')) return null;
          if (head === 'about') return null;
          if (!head) return site;
          if (head === 'books' || head === 'read') return site + ['books', a, b].filter(Boolean).map(enc).join('/');
          if (head === 'labs') return site + 'labs';
          if (head === 'blogs') return site + 'articles';
          if (head === 'paths') return site + 'courses';
          if (head === 'explore' || head === 'map') return site + 'fields';
          if (head === 'search') return site + (q.get('q') ? 'search?q=' + enc(q.get('q')) : 'search');
          if (head === 'saved') return site;
          return site + 'search?q=' + enc(parts[parts.length - 1].replace(/[-_]+/g, ' '));
        };
        const go = () => { const t = target(); if (t) location.replace(t); };
        go();
        addEventListener('hashchange', go);
        // Atlas search also needs server data: use the main site's search.
        const isSearch = el => el && /search/i.test(el.getAttribute('aria-label') || el.textContent || '');
        addEventListener('click', event => {
          const button = event.target.closest?.('header button');
          if (!isSearch(button)) return;
          event.preventDefault(); event.stopImmediatePropagation();
          location.assign(site + 'search');
        }, true);
        addEventListener('keydown', event => {
          if (event.key !== '/' || event.ctrlKey || event.metaKey || event.altKey) return;
          if (event.target.closest?.('input, textarea, select, [contenteditable="true"]')) return;
          event.preventDefault(); event.stopImmediatePropagation();
          location.assign(site + 'search');
        }, true);
      })();
    </script>
