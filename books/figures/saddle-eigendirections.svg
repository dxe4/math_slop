<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" aria-labelledby="title desc">
  <title id="title">Stable and unstable eigendirections of a planar saddle</title>
  <desc id="desc">Phase plane for A equal to the matrix with rows 1,2 and 2,1. The line y equals negative x is stable with arrows toward the origin. The line y equals x is unstable with arrows away from the origin.</desc>
  <defs>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#38bdf8"/></marker>
    <marker id="amberArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#fbbf24"/></marker>
  </defs>
  <rect width="760" height="500" rx="18" fill="#0f172a"/>
  <text x="380" y="30" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700">z′ = Az, A = [[1,2],[2,1]]</text>
  <g transform="translate(380 255)">
    <path d="M-315 0H315" stroke="#64748b" stroke-width="2"/>
    <path d="M0 205V-205" stroke="#64748b" stroke-width="2"/>
    <text x="320" y="-8" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="16">x</text>
    <text x="10" y="-207" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="16">y</text>
    <path d="M-205 -205L205 205" stroke="#38bdf8" stroke-width="5"/>
    <path d="M-205 205L205-205" stroke="#fbbf24" stroke-width="5"/>
    <path d="M-170 -170L-45 -45" stroke="#38bdf8" stroke-width="5" marker-end="url(#blueArrow)"/>
    <path d="M170 170L45 45" stroke="#38bdf8" stroke-width="5" marker-end="url(#blueArrow)"/>
    <path d="M35 -35L165 -165" stroke="#fbbf24" stroke-width="5" marker-end="url(#amberArrow)"/>
    <path d="M-35 35L-165 165" stroke="#fbbf24" stroke-width="5" marker-end="url(#amberArrow)"/>
    <circle r="8" fill="#f8fafc"/>
    <text x="-300" y="230" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="16" font-weight="700">stable: y = −x, λ = −1</text>
    <text x="80" y="230" fill="#fde68a" font-family="system-ui, sans-serif" font-size="16" font-weight="700">unstable: y = x, λ = 3</text>
  </g>
</svg>
