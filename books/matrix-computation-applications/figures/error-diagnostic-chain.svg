<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" role="img" aria-labelledby="title desc">
  <title id="title">From residual to forward error</title>
  <desc id="desc">Four boxes show residual, scaled backward error, a nearby problem, and forward error. The final arrow is labelled condition number, emphasizing that conditioning controls amplification.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#315ea8"/>
    </marker>
    <style>
      .box{fill:#eef5ff;stroke:#315ea8;stroke-width:3}.main{font:600 21px system-ui,sans-serif;fill:#17243b;text-anchor:middle}.sub{font:16px system-ui,sans-serif;fill:#31415c;text-anchor:middle}.arrow{stroke:#315ea8;stroke-width:3;marker-end:url(#arrow)}.label{font:600 15px system-ui,sans-serif;fill:#7a3f00;text-anchor:middle}@media(prefers-color-scheme:dark){.box{fill:#182a42;stroke:#8db9ff}.main,.sub{fill:#f2f6ff}.arrow{stroke:#8db9ff}.label{fill:#ffd29a}}
    </style>
  </defs>
  <rect class="box" x="20" y="75" rx="12" width="180" height="90"/>
  <text class="main" x="110" y="110">residual</text><text class="sub" x="110" y="140">r = b − A x̂</text>
  <line class="arrow" x1="205" y1="120" x2="260" y2="120"/><text class="label" x="232" y="98">scale</text>
  <rect class="box" x="270" y="75" rx="12" width="190" height="90"/>
  <text class="main" x="365" y="108">backward error</text><text class="sub" x="365" y="140">η</text>
  <line class="arrow" x1="465" y1="120" x2="520" y2="120"/><text class="label" x="492" y="98">interprets</text>
  <rect class="box" x="530" y="75" rx="12" width="180" height="90"/>
  <text class="main" x="620" y="108">nearby problem</text><text class="sub" x="620" y="140">(A + ΔA)x̂ = b + Δb</text>
  <line class="arrow" x1="715" y1="120" x2="770" y2="120"/><text class="label" x="742" y="91">amplified by</text><text class="label" x="742" y="109">κ(A)</text>
  <rect class="box" x="780" y="75" rx="12" width="160" height="90"/>
  <text class="main" x="860" y="108">forward error</text><text class="sub" x="860" y="140">‖x − x̂‖ / ‖x‖</text>
  <text class="sub" x="480" y="215">A small residual supports a small-error claim only after scaling and conditioning are accounted for.</text>
</svg>
