<text x="35.00" y="40.00" font-family="system-ui,sans-serif" font-size="24" fill="#233443" font-weight="700" text-anchor="start">Forward-solver error enters the likelihood</text>
<text x="35.00" y="70.00" font-family="system-ui,sans-serif" font-size="14" fill="#233443" font-weight="400" text-anchor="start">Exponential decay demonstrates how a coarse Euler solver can systematically miss the exact trajectory.</text>
<line x1="35.00" y1="488.00" x2="925.00" y2="488.00" stroke="#d4dce3" stroke-width="1"/>
<text x="35.00" y="508.00" font-family="system-ui,sans-serif" font-size="13" fill="#233443" font-weight="400" text-anchor="start">Example dx/dt=−x, x(0)=1. Euler step Δt=0.5 gives xₖ=0.5ᵏ; inference must control solver error relative to noise.</text>
