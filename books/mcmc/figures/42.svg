<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Forward-solver error enters the likelihood</title><desc id="desc">Exponential decay demonstrates how a coarse Euler solver can systematically miss the exact trajectory.</desc>
