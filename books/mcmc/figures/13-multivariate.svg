<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">A joint ESS can hide one slow direction</title>
<desc id="desc">For the rotated two-dimensional AR(1) example, Lambda is the identity and Sigma has eigenvalues 19 and one third. At n=19000, the 95 percent iid mean circle has radius 0.01776; the correlated-chain ellipse has semiaxes 0.07740 and 0.01025. mESS is about 7550 while slow-direction ESS is 1000.</desc>
