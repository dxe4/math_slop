<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">The level-posterior corrections telescope</title>
<desc id="desc">Example B first-coordinate posterior at dimensions 4, 16 and 64 is normal with means about 0.752586, 0.750610 and 0.750569. The signed corrections are minus 0.00197558 and minus 0.0000410291, summing with the level-4 mean to the level-64 mean. Each correction pairs draws from the two correct posterior marginals with a shared standard normal; copying a fine coordinate to the coarse level would yield the wrong zero correction.</desc>
