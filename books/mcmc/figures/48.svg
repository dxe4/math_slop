<text x="477.50" y="178.00" font-family="system-ui,sans-serif" font-size="16" fill="#167d8d" font-weight="400" text-anchor="middle">2. Statistical model</text>
<text x="477.50" y="202.00" font-family="system-ui,sans-serif" font-size="16" fill="#167d8d" font-weight="400" text-anchor="middle">Assumptions + priors</text>
<rect x="665" y="135" width="235" height="100" rx="7" fill="#ffffff" stroke="#bb5b27"/>
<text x="782.50" y="178.00" font-family="system-ui,sans-serif" font-size="16" fill="#bb5b27" font-weight="400" text-anchor="middle">3. Numerical target</text>
<text x="782.50" y="202.00" font-family="system-ui,sans-serif" font-size="16" fill="#bb5b27" font-weight="400" text-anchor="middle">Transforms + solvers</text>
<rect x="665" y="325" width="235" height="100" rx="7" fill="#ffffff" stroke="#275c91"/>
<text x="782.50" y="368.00" font-family="system-ui,sans-serif" font-size="16" fill="#275c91" font-weight="400" text-anchor="middle">4. MCMC computation</text>
<text x="782.50" y="392.00" font-family="system-ui,sans-serif" font-size="16" fill="#275c91" font-weight="400" text-anchor="middle">Kernels + diagnostics</text>
<rect x="360" y="325" width="235" height="100" rx="7" fill="#ffffff" stroke="#167d8d"/>
<text x="477.50" y="368.00" font-family="system-ui,sans-serif" font-size="16" fill="#167d8d" font-weight="400" text-anchor="middle">5. Accuracy assessment</text>
<text x="477.50" y="392.00" font-family="system-ui,sans-serif" font-size="16" fill="#167d8d" font-weight="400" text-anchor="middle">MCSE + sensitivity</text>
