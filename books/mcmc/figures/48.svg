<text x="35.00" y="40.00" font-family="system-ui,sans-serif" font-size="24" fill="#233443" font-weight="700" text-anchor="start">An end-to-end project needs an explicit error budget</text>
<text x="35.00" y="70.00" font-family="system-ui,sans-serif" font-size="14" fill="#233443" font-weight="400" text-anchor="start">Each stage answers a different question; every conclusion depends on the previous checks.</text>
<line x1="35.00" y1="488.00" x2="925.00" y2="488.00" stroke="#d4dce3" stroke-width="1"/>
<text x="35.00" y="508.00" font-family="system-ui,sans-serif" font-size="13" fill="#233443" font-weight="400" text-anchor="start">A reproducible capstone reports the estimand, assumptions, algorithm, diagnostics, MCSE, sensitivity, and archived code.</text>
<rect x="55" y="135" width="235" height="100" rx="7" fill="#ffffff" stroke="#275c91"/>
<text x="172.50" y="178.00" font-family="system-ui,sans-serif" font-size="16" fill="#275c91" font-weight="400" text-anchor="middle">1. Scientific question</text>
<text x="172.50" y="202.00" font-family="system-ui,sans-serif" font-size="16" fill="#275c91" font-weight="400" text-anchor="middle">Estimand + decision</text>
