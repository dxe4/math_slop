<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">An end-to-end project needs an explicit error budget</title><desc id="desc">Each stage answers a different question; every conclusion depends on the previous checks.</desc>
