<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Extra holding increases asymptotic variance</title><desc id="desc">Two symmetric two-state kernels have switching probabilities a=0.1 and a=0.4 and uniform stationary distribution. Their centered-state autocorrelations are (1-2a)^k.</desc><rect width="960" height="560" fill="#fafbf9"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#233445"/></marker></defs>
<text x="35.00" y="43.00" fill="#233445" font-family="system-ui,sans-serif" font-size="25" text-anchor="start">Extra holding increases asymptotic variance</text>
<line x1="90" y1="430" x2="860" y2="430" stroke="#233445" stroke-width="2"/>
<line x1="90" y1="110" x2="90" y2="430" stroke="#233445" stroke-width="2"/>
<text x="475.00" y="469.00" fill="#233445" font-family="system-ui,sans-serif" font-size="17" text-anchor="middle">lag k (0 to 12)</text>
<text x="90.00" y="93.00" fill="#233445" font-family="system-ui,sans-serif" font-size="17" text-anchor="start">autocorrelation ρ(k)</text>
