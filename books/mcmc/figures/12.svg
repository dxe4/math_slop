<text x="390.00" y="140.00" fill="#b45309" font-family="system-ui,sans-serif" font-size="18" text-anchor="start">switch 0.1 → ρ(k) = 0.8ᵏ; IACT = 9</text>
<text x="390.00" y="180.00" fill="#087f7b" font-family="system-ui,sans-serif" font-size="18" text-anchor="start">switch 0.4 → ρ(k) = 0.2ᵏ; IACT = 1.5</text>
<text x="45.00" y="509.00" fill="#233445" font-family="system-ui,sans-serif" font-size="17" text-anchor="start">Here larger off-diagonal probabilities improve asymptotic variance at equal step cost.</text>
<text x="45.00" y="537.00" fill="#233445" font-family="system-ui,sans-serif" font-size="16" text-anchor="start">Kernel comparisons must also account for computation per transition.</text></svg>
