<text x="35.00" y="40.00" font-family="system-ui,sans-serif" font-size="24" fill="#233443" font-weight="700" text-anchor="start">Cluster updates can move a correlated region</text>
<text x="35.00" y="70.00" font-family="system-ui,sans-serif" font-size="14" fill="#233443" font-weight="400" text-anchor="start">Neighboring aligned spins can be bonded and flipped together in a ferromagnetic Ising model.</text>
