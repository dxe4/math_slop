<text x="35.00" y="508.00" font-family="system-ui,sans-serif" font-size="13" fill="#233443" font-weight="400" text-anchor="start">Schematic cluster, not a simulated draw. For zero-field Ising, bond probability is 1−exp(−2βJ) between equal spins.</text>
