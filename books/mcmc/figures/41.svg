<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Cluster updates can move a correlated region</title><desc id="desc">Neighboring aligned spins can be bonded and flipped together in a ferromagnetic Ising model.</desc>
