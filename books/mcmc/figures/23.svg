<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">A position-dependent metric changes normalization</title><desc id="desc">For scalar metric G(q)=exp(q), Gaussian momentum p|q~N(0,G(q)) has widths that increase with q. The Hamiltonian must include 0.5 log G(q) as well as p²/(2G(q)) to preserve the intended position marginal.</desc><rect width="960" height="560" fill="#fafbf9"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#233445"/></marker></defs>
