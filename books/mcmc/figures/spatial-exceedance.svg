<svg xmlns="http://www.w3.org/2000/svg" width="480" height="780" viewBox="0 0 640 1040" role="img" aria-labelledby="spatial-exceedance-title spatial-exceedance-desc">
  <title id="spatial-exceedance-title">Two half-planes, one joint Gaussian event</title>
  <desc id="spatial-exceedance-desc">Three direction diagrams in the plane of independent standard normal variables Z1 and Z2. Define F1=Z1 and F2=rho Z1+sqrt(1-rho squared) Z2. The blue right half-plane is F1 positive. The orange rotated half-plane is F2 positive. Their teal outlined intersection is the event that both are positive. For rho zero, one half, and minus one half, alpha=arcsin(rho) is zero, 30, and minus 30 degrees. The intersection angles are 90, 120, and 60 degrees, with probabilities one quarter, one third, and one sixth. Each marginal probability remains one half. The standard normal distribution is rotationally symmetric, so its angle is uniform; its radius is not uniform. The displayed disks illustrate directions, not spatial locations or a bounded sample space.</desc>
  <defs>
    <marker id="spatial-axis-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#64736d"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #233443; }
      .panel { fill: #fffefa; stroke: #d4dce3; stroke-width: 1.5; }
      .axis { stroke: #64736d; stroke-width: 1.5; }
      .first-half { fill: #dce7f2; }
      .second-half { fill: #f3dfcf; }
      .joint { fill: #afd7ce; stroke: #167b68; stroke-width: 3.5; stroke-linejoin: round; }
      .first-boundary { stroke: #275c91; stroke-width: 2.5; }
      .second-boundary { stroke: #bb5b27; stroke-width: 2.5; stroke-dasharray: 7 5; }
      .angle { fill: none; stroke: #175345; stroke-width: 2; }
      .axis-label { font-size: 22px; }
      .panel-heading { font-size: 28px; font-weight: 650; }
      .probability { font-size: 30px; font-weight: 700; fill: #175345; }
    </style>
  </defs>

  <rect width="640" height="1040" rx="14" fill="#f7f8fa"/>
  <text x="28" y="43" font-size="30" font-weight="700">Two half-planes, one joint event</text>
  <text x="28" y="78" font-size="24">Z₁ and Z₂ are independent N(0, 1).</text>
  <text x="28" y="114" font-size="26">F₁ = Z₁;  F₂ = ρZ₁ + √(1 − ρ²)Z₂</text>

  <rect x="28" y="139" width="26" height="20" class="first-half" stroke="#275c91" stroke-width="2"/>
  <text x="68" y="157" font-size="24">F₁ &gt; 0: the right half-plane</text>
  <rect x="28" y="169" width="26" height="20" class="second-half" stroke="#bb5b27" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="68" y="187" font-size="24">F₂ &gt; 0: a rotated half-plane</text>
  <rect x="28" y="199" width="26" height="20" class="joint"/>
  <text x="68" y="217" font-size="24">Both &gt; 0: the outlined intersection</text>

  <g role="group" aria-labelledby="spatial-panel-zero" data-rho="0" data-alpha-degrees="0" data-wedge-degrees="90" data-joint-probability="1/4">
    <rect class="panel" x="16" y="234" width="608" height="220" rx="10"/>
    <text id="spatial-panel-zero" class="panel-heading" x="282" y="278">ρ = 0;  α = 0°</text>
    <g transform="translate(150 354)">
      <circle r="82" fill="#fff" stroke="#d4dce3" stroke-width="1.5"/>
      <path class="first-half" d="M0 -82 A82 82 0 0 1 0 82 Z"/>
      <path class="second-half" d="M82 0 A82 82 0 0 0 -82 0 Z"/>
      <path class="joint" d="M0 0 L82 0 A82 82 0 0 0 0 -82 Z"/>
      <line class="axis" x1="-101" y1="0" x2="107" y2="0" marker-end="url(#spatial-axis-arrow)"/>
      <line class="axis" x1="0" y1="99" x2="0" y2="-103" marker-end="url(#spatial-axis-arrow)"/>
      <line class="first-boundary" x1="0" y1="82" x2="0" y2="-82"/>
      <line class="second-boundary" x1="-82" y1="0" x2="82" y2="0"/>
      <path class="angle" d="M31 0 A31 31 0 0 0 0 -31"/>
      <circle r="3" fill="#233443"/>
      <text class="axis-label" x="94" y="28">Z₁</text>
      <text class="axis-label" x="12" y="-91">Z₂</text>
    </g>
    <text x="282" y="327" font-size="26">Wedge: 90°</text>
    <text class="probability" x="282" y="375">P(both) = 1/4</text>
    <text x="282" y="419" font-size="24">Each marginal = 1/2</text>
  </g>

  <g role="group" aria-labelledby="spatial-panel-positive" data-rho="1/2" data-alpha-degrees="30" data-wedge-degrees="120" data-joint-probability="1/3">
    <rect class="panel" x="16" y="464" width="608" height="220" rx="10"/>
    <text id="spatial-panel-positive" class="panel-heading" x="282" y="508">ρ = 1/2;  α = 30°</text>
    <g transform="translate(150 584)">
      <circle r="82" fill="#fff" stroke="#d4dce3" stroke-width="1.5"/>
      <path class="first-half" d="M0 -82 A82 82 0 0 1 0 82 Z"/>
      <path class="second-half" d="M71.014083 41 A82 82 0 0 0 -71.014083 -41 Z"/>
      <path class="joint" d="M0 0 L71.014083 41 A82 82 0 0 0 0 -82 Z"/>
      <line class="axis" x1="-101" y1="0" x2="107" y2="0" marker-end="url(#spatial-axis-arrow)"/>
      <line class="axis" x1="0" y1="99" x2="0" y2="-103" marker-end="url(#spatial-axis-arrow)"/>
      <line class="first-boundary" x1="0" y1="82" x2="0" y2="-82"/>
      <line class="second-boundary" x1="-71.014083" y1="-41" x2="71.014083" y2="41"/>
      <path class="angle" d="M26.846788 15.5 A31 31 0 0 0 0 -31"/>
      <circle r="3" fill="#233443"/>
      <text class="axis-label" x="94" y="28">Z₁</text>
      <text class="axis-label" x="12" y="-91">Z₂</text>
    </g>
    <text x="282" y="557" font-size="26">Wedge: 120°</text>
    <text class="probability" x="282" y="605">P(both) = 1/3</text>
    <text x="282" y="649" font-size="24">Each marginal = 1/2</text>
  </g>

  <g role="group" aria-labelledby="spatial-panel-negative" data-rho="-1/2" data-alpha-degrees="-30" data-wedge-degrees="60" data-joint-probability="1/6">
    <rect class="panel" x="16" y="694" width="608" height="220" rx="10"/>
    <text id="spatial-panel-negative" class="panel-heading" x="282" y="738">ρ = −1/2;  α = −30°</text>
    <g transform="translate(150 814)">
      <circle r="82" fill="#fff" stroke="#d4dce3" stroke-width="1.5"/>
      <path class="first-half" d="M0 -82 A82 82 0 0 1 0 82 Z"/>
      <path class="second-half" d="M71.014083 -41 A82 82 0 0 0 -71.014083 41 Z"/>
      <path class="joint" d="M0 0 L71.014083 -41 A82 82 0 0 0 0 -82 Z"/>
      <line class="axis" x1="-101" y1="0" x2="107" y2="0" marker-end="url(#spatial-axis-arrow)"/>
      <line class="axis" x1="0" y1="99" x2="0" y2="-103" marker-end="url(#spatial-axis-arrow)"/>
      <line class="first-boundary" x1="0" y1="82" x2="0" y2="-82"/>
      <line class="second-boundary" x1="-71.014083" y1="41" x2="71.014083" y2="-41"/>
      <path class="angle" d="M26.846788 -15.5 A31 31 0 0 0 0 -31"/>
      <circle r="3" fill="#233443"/>
      <text class="axis-label" x="94" y="28">Z₁</text>
      <text class="axis-label" x="12" y="-91">Z₂</text>
    </g>
    <text x="282" y="787" font-size="26">Wedge: 60°</text>
    <text class="probability" x="282" y="835">P(both) = 1/6</text>
    <text x="282" y="879" font-size="24">Each marginal = 1/2</text>
  </g>

  <line x1="28" y1="933" x2="612" y2="933" stroke="#d4dce3" stroke-width="1.5"/>
  <text x="28" y="965" font-size="24">α = asin(ρ);  −α &lt; Θ &lt; π/2.</text>
  <text x="28" y="995" font-size="24">Uniform angle: P(both) = (π/2 + α)/(2π).</text>
  <text x="28" y="1025" font-size="22">Disks show directions; Gaussian radii are not uniform.</text>
</svg>
