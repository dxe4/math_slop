<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Path sampling turns a ratio into an area</title><desc id="desc">A solvable Gaussian path illustrates log(Z₁/Z₀) = ∫₀¹ Eβ[log L] dβ.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="#82909b"/></marker></defs>
<rect width="960" height="540" rx="14" fill="#f7f8fa"/>
<text x="35.00" y="40.00" font-family="system-ui,sans-serif" font-size="24" fill="#233443" font-weight="700" text-anchor="start">Path sampling turns a ratio into an area</text>
<text x="35.00" y="70.00" font-family="system-ui,sans-serif" font-size="14" fill="#233443" font-weight="400" text-anchor="start">A solvable Gaussian path illustrates log(Z₁/Z₀) = ∫₀¹ Eβ[log L] dβ.</text>
<line x1="35.00" y1="488.00" x2="925.00" y2="488.00" stroke="#d4dce3" stroke-width="1"/>
<text x="35.00" y="508.00" font-family="system-ui,sans-serif" font-size="13" fill="#233443" font-weight="400" text-anchor="start">Example: x ∼ N(0,1), L(x)=exp(−x²/2). The integral is −½ log 2; L omits a data constant.</text>
<line x1="90.00" y1="415.00" x2="640.00" y2="415.00" stroke="#82909b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="90.00" y1="415.00" x2="90.00" y2="140.00" stroke="#82909b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="365.00" y="450.00" font-family="system-ui,sans-serif" font-size="15" fill="#233443" font-weight="400" text-anchor="middle">inverse temperature β</text>
<text x="90.00" y="125.00" font-family="system-ui,sans-serif" font-size="15" fill="#233443" font-weight="400" text-anchor="start">Eβ[log L(x)]</text>
