<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Local moves connect a discrete state space</title><desc id="desc">The cube is the state graph of three binary variables under one-bit proposals.</desc>
