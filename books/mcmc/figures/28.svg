<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Resampling creates a particle genealogy</title><desc id="desc">Particles branch when selected multiple times; extinct ancestors leave no descendants.</desc>
