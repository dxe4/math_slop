<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Partial pooling depends on information per group</title><desc id="desc">Normal–normal example: posterior group means shrink toward the population mean μ = 0.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="#82909b"/></marker></defs>
<rect width="960" height="540" rx="14" fill="#f7f8fa"/>
<text x="35.00" y="40.00" font-family="system-ui,sans-serif" font-size="24" fill="#233443" font-weight="700" text-anchor="start">Partial pooling depends on information per group</text>
<text x="35.00" y="70.00" font-family="system-ui,sans-serif" font-size="14" fill="#233443" font-weight="400" text-anchor="start">Normal–normal example: posterior group means shrink toward the population mean μ = 0.</text>
<line x1="35.00" y1="488.00" x2="925.00" y2="488.00" stroke="#d4dce3" stroke-width="1"/>
<text x="35.00" y="508.00" font-family="system-ui,sans-serif" font-size="13" fill="#233443" font-weight="400" text-anchor="start">Known σ²=τ²=1: E[θⱼ|ȳⱼ]=[nⱼ/(nⱼ+1)]ȳⱼ. Small groups shrink more; this is not a causal identification argument.</text>
