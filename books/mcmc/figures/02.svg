<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">The typical radius moves away from the mode</title><desc id="desc">For a 20 dimensional standard normal, radial mass is proportional to r^19 exp(-r²/2), peaking at sqrt(19), while density at a point is largest at radius zero. Curves are scaled independently to unit peak.</desc><rect width="960" height="560" fill="#fafbf9"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#233445"/></marker></defs>
