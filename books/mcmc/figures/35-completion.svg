<text x="479.50" y="216.00" fill="#233445" font-family="system-ui,sans-serif" font-size="22" font-weight="normal" text-anchor="middle">0111</text>
<rect x="43.00" y="251.00" width="111.00" height="55.00" rx="6" fill="#e1ecef" stroke="none"/>
<text x="98.50" y="286.00" fill="#233445" font-family="system-ui,sans-serif" font-size="22" font-weight="normal" text-anchor="middle">1000</text>
<rect x="170.00" y="251.00" width="111.00" height="55.00" rx="6" fill="#e1ecef" stroke="none"/>
