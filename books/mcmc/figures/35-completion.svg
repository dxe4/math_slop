<text x="43.00" y="419.00" fill="#233445" font-family="system-ui,sans-serif" font-size="17" font-weight="normal" text-anchor="start">Any zero finishes at t = 1; only 1111 yields first value 1 at t = 2.</text>
<text x="635.00" y="92.00" fill="#233445" font-family="system-ui,sans-serif" font-size="18" font-weight="bold" text-anchor="start">Expected reported value</text>
<text x="635.00" y="151.00" fill="#b45309" font-family="system-ui,sans-serif" font-size="17" font-weight="normal" text-anchor="start">first completed</text>
<rect x="635.00" y="165.00" width="268.00" height="27.00" rx="3" fill="#e8ecea" stroke="none"/>
<rect x="635.00" y="165.00" width="16.75" height="27.00" rx="3" fill="#b45309" stroke="none"/>
<text x="911.00" y="185.00" fill="#b45309" font-family="system-ui,sans-serif" font-size="18" font-weight="normal" text-anchor="start">1/16</text>
<text x="635.00" y="253.00" fill="#087f7b" font-family="system-ui,sans-serif" font-size="17" font-weight="normal" text-anchor="start">all four, then average</text>
<rect x="635.00" y="267.00" width="268.00" height="27.00" rx="3" fill="#e8ecea" stroke="none"/>
<rect x="635.00" y="267.00" width="134.00" height="27.00" rx="3" fill="#087f7b" stroke="none"/>
<text x="911.00" y="287.00" fill="#087f7b" font-family="system-ui,sans-serif" font-size="18" font-weight="normal" text-anchor="start">1/2</text>
<text x="635.00" y="371.00" fill="#233445" font-family="system-ui,sans-serif" font-size="17" font-weight="normal" text-anchor="start">Each worker: E[Xc] = 1/2</text>
<text x="43.00" y="483.00" fill="#b45309" font-family="system-ui,sans-serif" font-size="19" font-weight="normal" text-anchor="start">P(first = 1) = P(1111) = (1/2)⁴ = 1/16</text>
<text x="43.00" y="520.00" fill="#637d7c" font-family="system-ui,sans-serif" font-size="16" font-weight="normal" text-anchor="start">Choose worker IDs in advance and wait for their results to retain the 1/2 mean.</text>
</svg>
