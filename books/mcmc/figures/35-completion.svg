<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">First completion selects the fast value</title>
<desc id="desc">Four independent Bernoulli one-half workers take one time unit for zero and two for one. Of 16 equally likely binary output vectors, the first completed result is one only for 1111, so its expectation is one sixteenth. Waiting for all four prespecified outputs and averaging has expectation one half.</desc>
<rect width="960" height="560" fill="#fafbf9"/>
<text x="36.00" y="43.00" fill="#233445" font-family="system-ui,sans-serif" font-size="25" font-weight="normal" text-anchor="start">First completion selects the fast value</text>
<text x="43.00" y="91.00" fill="#233445" font-family="system-ui,sans-serif" font-size="18" font-weight="bold" text-anchor="start">All 16 equally likely four-worker outcomes</text>
<rect x="43.00" y="111.00" width="111.00" height="55.00" rx="6" fill="#e1ecef" stroke="none"/>
<text x="98.50" y="146.00" fill="#233445" font-family="system-ui,sans-serif" font-size="22" font-weight="normal" text-anchor="middle">0000</text>
