<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">Exact HMC duration: the square remembers</title>
<desc id="desc">For exact harmonic-oscillator flow with independent standard-normal momentum refresh, fixed-duration lag-one correlations are cos T for q and cos squared T for q squared. At pi over two both vanish; at pi the position flips sign but q squared is frozen; at two pi both are frozen. An independent uniform duration over zero to two pi gives a=0 and b=one half, while choosing pi or two pi equally gives a=0 and b=1.</desc>
