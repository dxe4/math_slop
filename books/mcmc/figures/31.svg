<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Lagged coupling cancels after meeting</title><desc id="desc">Plot Xₜ against Yₜ₋₁: the correction h(Xₜ) − h(Yₜ₋₁) vanishes once the paths meet.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="#82909b"/></marker></defs>
<rect width="960" height="540" rx="14" fill="#f7f8fa"/>
<text x="35.00" y="40.00" font-family="system-ui,sans-serif" font-size="24" fill="#233443" font-weight="700" text-anchor="start">Lagged coupling cancels after meeting</text>
<text x="35.00" y="70.00" font-family="system-ui,sans-serif" font-size="14" fill="#233443" font-weight="400" text-anchor="start">Plot Xₜ against Yₜ₋₁: the correction h(Xₜ) − h(Yₜ₋₁) vanishes once the paths meet.</text>
<line x1="35.00" y1="488.00" x2="925.00" y2="488.00" stroke="#d4dce3" stroke-width="1"/>
<text x="35.00" y="508.00" font-family="system-ui,sans-serif" font-size="13" fill="#233443" font-weight="400" text-anchor="start">Schematic faithful coupling with τ = 6. Unbiasedness also needs integrability and meeting-time tail conditions.</text>
<line x1="90.00" y1="410.00" x2="860.00" y2="410.00" stroke="#82909b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="90.00" y1="410.00" x2="90.00" y2="145.00" stroke="#82909b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="475.00" y="445.00" font-family="system-ui,sans-serif" font-size="15" fill="#233443" font-weight="400" text-anchor="middle">iteration t</text>
<text x="90.00" y="130.00" font-family="system-ui,sans-serif" font-size="15" fill="#233443" font-weight="400" text-anchor="start">state value (schematic)</text>
<line x1="100.00" y1="175.00" x2="100.00" y2="385.00" stroke="#cfb69f" stroke-width="2"/>
<line x1="170.00" y1="205.00" x2="170.00" y2="355.00" stroke="#cfb69f" stroke-width="2"/>
<line x1="240.00" y1="257.50" x2="240.00" y2="332.50" stroke="#cfb69f" stroke-width="2"/>
<line x1="310.00" y1="227.50" x2="310.00" y2="310.00" stroke="#cfb69f" stroke-width="2"/>
<line x1="380.00" y1="295.00" x2="380.00" y2="340.00" stroke="#cfb69f" stroke-width="2"/>
<line x1="450.00" y1="317.50" x2="450.00" y2="298.75" stroke="#cfb69f" stroke-width="2"/>
<polyline points="100.00,385.00 170.00,355.00 240.00,332.50 310.00,310.00 380.00,340.00 450.00,298.75 520.00,280.00 590.00,302.50 660.00,265.00 730.00,287.50 800.00,272.50" stroke="#bb5b27" stroke-width="5" fill="none" stroke-linejoin="round"/>
<polyline points="100.00,175.00 170.00,205.00 240.00,257.50 310.00,227.50 380.00,295.00 450.00,317.50 520.00,280.00 590.00,302.50 660.00,265.00 730.00,287.50 800.00,272.50" stroke="#275c91" stroke-width="3" fill="none" stroke-linejoin="round"/>
<line x1="520.00" y1="130.00" x2="520.00" y2="410.00" stroke="#82909b" stroke-width="1" stroke-dasharray="7 5"/>
<text x="535.00" y="145.00" font-family="system-ui,sans-serif" font-size="16" fill="#233443" font-weight="400" text-anchor="start">τ = 6: Xₜ = Yₜ₋₁ thereafter</text>
<text x="140.00" y="155.00" font-family="system-ui,sans-serif" font-size="17" fill="#275c91" font-weight="400" text-anchor="start">Xₜ</text>
<text x="140.00" y="370.00" font-family="system-ui,sans-serif" font-size="17" fill="#bb5b27" font-weight="400" text-anchor="start">Yₜ₋₁</text>
</svg>
