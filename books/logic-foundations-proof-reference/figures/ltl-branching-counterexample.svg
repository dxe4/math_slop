<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" role="img" aria-labelledby="title desc">
  <title id="title">Trace-equivalent transition systems separated by AG EF p</title>
  <desc id="desc">System A has a non-p state a with a self-loop and an edge to a p-state with a self-loop. System B starts at non-p state b and branches to a good non-p state g, a dead non-p state d, and the p-state. State g loops or reaches p, while d loops forever. Both systems have the same traces, but only A makes p reachable from every reachable state.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" class="arrowhead"/>
    </marker>
  </defs>
  <style>
    .panel { fill: none; stroke: #64748b; stroke-width: 2; }
    .edge { fill: none; stroke: #334155; stroke-width: 2.5; marker-end: url(#arrow); }
    .arrowhead { fill: #334155; }
    .node { fill: #f8fafc; stroke: #0f172a; stroke-width: 2.5; }
    .pnode { fill: #dbeafe; stroke: #1d4ed8; }
    .dead { fill: #fee2e2; stroke: #b91c1c; }
    .label { fill: #0f172a; font: 600 20px system-ui, sans-serif; text-anchor: middle; }
    .heading { fill: #0f172a; font: 700 22px system-ui, sans-serif; }
    .note { fill: #334155; font: 16px system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .panel { stroke: #94a3b8; }
      .edge { stroke: #e2e8f0; }
      .arrowhead { fill: #e2e8f0; }
      .node { fill: #111827; stroke: #f1f5f9; }
      .pnode { fill: #1e3a8a; stroke: #93c5fd; }
      .dead { fill: #7f1d1d; stroke: #fecaca; }
      .label, .heading { fill: #f8fafc; }
      .note { fill: #cbd5e1; }
    }
  </style>

  <rect class="panel" x="20" y="25" width="390" height="330" rx="14"/>
  <text class="heading" x="45" y="60">System A: AG EF p holds</text>
  <circle class="node" cx="125" cy="190" r="36"/>
  <text class="label" x="125" y="197">a</text>
  <circle class="node pnode" cx="310" cy="190" r="36"/>
  <text class="label" x="310" y="197">p</text>
  <path class="edge" d="M161 190 L270 190"/>
  <path class="edge" d="M105 157 C55 85, 195 85, 145 157"/>
  <path class="edge" d="M290 157 C240 85, 380 85, 330 157"/>
  <text class="note" x="84" y="286">Every reachable state can reach p.</text>

  <rect class="panel" x="440" y="25" width="460" height="330" rx="14"/>
  <text class="heading" x="465" y="60">System B: AG EF p fails</text>
  <circle class="node" cx="515" cy="190" r="36"/>
  <text class="label" x="515" y="197">b</text>
  <circle class="node" cx="665" cy="170" r="36"/>
  <text class="label" x="665" y="177">g</text>
  <circle class="node dead" cx="665" cy="270" r="36"/>
  <text class="label" x="665" y="277">d</text>
  <circle class="node pnode" cx="830" cy="170" r="36"/>
  <text class="label" x="830" y="177">p</text>
  <path class="edge" d="M550 185 L629 176"/>
  <path class="edge" d="M547 207 L630 252"/>
  <path class="edge" d="M548 201 C620 225, 740 225, 804 191"/>
  <path class="edge" d="M701 170 L790 170"/>
  <path class="edge" d="M645 137 C595 80, 735 80, 685 137"/>
  <path class="edge" d="M692 247 C745 225, 745 315, 692 293"/>
  <path class="edge" d="M810 137 C760 80, 890 80, 850 137"/>
  <text class="note" x="488" y="330">The reachable d-loop can never reach p.</text>
</svg>
