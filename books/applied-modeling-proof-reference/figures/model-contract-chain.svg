<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 330" role="img" aria-labelledby="title desc">
  <title id="title">Model contract chain from world state to action</title>
  <desc id="desc">Six boxes show world features z, retained state x, observations y, fitted parameters theta hat, prediction, and action a. The connecting maps are representation R, observation H theta, estimator E, prediction P, and decision D. Each arrow has a distinct audit question beneath it.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#93c5fd"/></marker>
  </defs>
  <rect width="1040" height="330" rx="18" fill="#0f172a"/>
  <text x="520" y="34" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="21" font-weight="700">One model, five separately auditable maps</text>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <g fill="#172554" stroke="#60a5fa" stroke-width="2">
      <rect x="25" y="80" width="130" height="70" rx="10"/><rect x="200" y="80" width="130" height="70" rx="10"/>
      <rect x="375" y="80" width="130" height="70" rx="10"/><rect x="550" y="80" width="130" height="70" rx="10"/>
      <rect x="725" y="80" width="130" height="70" rx="10"/><rect x="885" y="80" width="130" height="70" rx="10"/>
    </g>
    <g fill="#f8fafc" font-size="17" font-weight="700">
      <text x="90" y="108">world features</text><text x="90" y="134">z</text>
      <text x="265" y="108">retained state</text><text x="265" y="134">x</text>
      <text x="440" y="108">observations</text><text x="440" y="134">y</text>
      <text x="615" y="108">fitted parameter</text><text x="615" y="134">θ̂</text>
      <text x="790" y="108">prediction</text><text x="790" y="134">ŷ</text>
      <text x="950" y="108">action</text><text x="950" y="134">a</text>
    </g>
    <g stroke="#93c5fd" stroke-width="3" marker-end="url(#arrow)">
      <path d="M155 115H193"/><path d="M330 115H368"/><path d="M505 115H543"/><path d="M680 115H718"/><path d="M855 115H878"/>
    </g>
    <g fill="#bfdbfe" font-size="16" font-weight="700">
      <text x="177" y="100">R</text><text x="352" y="100">Hθ</text><text x="527" y="100">E</text><text x="702" y="100">P</text><text x="867" y="100">D</text>
    </g>
    <g fill="#e2e8f0" font-size="14">
      <text x="177" y="205">What was</text><text x="177" y="224">discarded?</text>
      <text x="352" y="205">How were data</text><text x="352" y="224">generated?</text>
      <text x="527" y="205">What identifies</text><text x="527" y="224">the parameter?</text>
      <text x="702" y="205">Where may the</text><text x="702" y="224">forecast travel?</text>
      <text x="867" y="205">Whose loss and</text><text x="867" y="224">constraints?</text>
    </g>
  </g>
  <path d="M90 170H950" stroke="#475569" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="520" y="292" text-anchor="middle" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="17">Correctness at one arrow does not repair a failure at another.</text>
</svg>
