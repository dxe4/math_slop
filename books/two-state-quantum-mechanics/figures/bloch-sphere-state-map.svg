<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
  <title id="title">Bloch sphere state map</title>
  <desc id="desc">A circle and dashed equator represent the Bloch sphere in perspective. The z axis joins ket zero at the north pole to ket one at the south pole. The x and y Pauli axes cross the center. A vector r points from the maximally mixed center to a pure-state boundary point.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#315ea8"/></marker>
    <style>
      .sphere{fill:#eef6ff;fill-opacity:.72;stroke:#315ea8;stroke-width:4}.axis{stroke:#40526d;stroke-width:2.5;marker-end:url(#arrow)}.hidden{fill:none;stroke:#6f8099;stroke-width:2;stroke-dasharray:8 7}.front{fill:none;stroke:#40526d;stroke-width:2}.state{stroke:#c44d1a;stroke-width:5;marker-end:url(#arrow)}.point{fill:#c44d1a}.label{font:20px system-ui,sans-serif;fill:#17243b}.small{font:17px system-ui,sans-serif;fill:#31415c}@media(prefers-color-scheme:dark){.sphere{fill:#162b45;stroke:#8db9ff}.axis,.front{stroke:#d4e2f7}.hidden{stroke:#92a4bd}.state{stroke:#ff9b72}.point{fill:#ff9b72}.label,.small{fill:#f2f6ff}}
    </style>
  </defs>
  <circle class="sphere" cx="365" cy="280" r="205"/>
  <path class="hidden" d="M160 280 C160 215 570 215 570 280"/>
  <path class="front" d="M160 280 C160 345 570 345 570 280"/>
  <line class="axis" x1="365" y1="520" x2="365" y2="42"/>
  <line class="axis" x1="105" y1="330" x2="632" y2="228"/>
  <line class="axis" x1="182" y1="145" x2="574" y2="434"/>
  <line class="state" x1="365" y1="280" x2="500" y2="134"/>
  <circle class="point" cx="500" cy="134" r="8"/>
  <circle cx="365" cy="280" r="6" fill="#40526d"/>
  <text class="label" x="378" y="54">z</text><text class="label" x="642" y="228">x</text><text class="label" x="580" y="452">y</text>
  <text class="label" x="382" y="85">|0⟩</text><text class="label" x="382" y="512">|1⟩</text>
  <text class="label" x="608" y="270">|+⟩</text><text class="label" x="104" y="368">|−⟩</text>
  <text class="label" x="508" y="126">r</text><text class="small" x="382" y="304">I/2</text>
  <text class="small" x="42" y="535">Boundary: pure states ‖r‖ = 1 · Interior: mixed states ‖r‖ &lt; 1</text>
</svg>
