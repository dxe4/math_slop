<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">A computational graph with two shared inputs</title>
  <desc id="desc">Inputs x and y each feed two branches. The upper branch multiplies them and applies sine. The lower branch adds them and squares the result. A final addition combines both branches into f.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#243447"/>
    </marker>
    <style>
      .node { fill: #f7fbff; stroke: #243447; stroke-width: 2; }
      .input { fill: #fff4d6; }
      .output { fill: #e4f5e9; }
      .edge { fill: none; stroke: #243447; stroke-width: 2.2; marker-end: url(#arrow); }
      .label { fill: #17212b; font: 600 20px sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .branch { fill: #425466; font: 16px sans-serif; text-anchor: middle; }
    </style>
  </defs>
  <text class="branch" x="445" y="32">product branch</text>
  <text class="branch" x="445" y="333">sum branch</text>
  <rect class="node input" x="35" y="92" width="90" height="58" rx="12"/><text class="label" x="80" y="121">x</text>
  <rect class="node input" x="35" y="210" width="90" height="58" rx="12"/><text class="label" x="80" y="239">y</text>
  <rect class="node" x="245" y="66" width="130" height="58" rx="12"/><text class="label" x="310" y="95">multiply</text>
  <rect class="node" x="465" y="66" width="110" height="58" rx="12"/><text class="label" x="520" y="95">sine</text>
  <rect class="node" x="245" y="236" width="130" height="58" rx="12"/><text class="label" x="310" y="265">add</text>
  <rect class="node" x="465" y="236" width="110" height="58" rx="12"/><text class="label" x="520" y="265">square</text>
  <rect class="node" x="665" y="151" width="105" height="58" rx="12"/><text class="label" x="717" y="180">add</text>
  <rect class="node output" x="805" y="151" width="70" height="58" rx="12"/><text class="label" x="840" y="180">f</text>
  <path class="edge" d="M125 112 C170 112,190 95,245 95"/>
  <path class="edge" d="M125 230 C180 230,185 110,245 100"/>
  <path class="edge" d="M125 130 C180 130,185 250,245 260"/>
  <path class="edge" d="M125 248 C170 248,190 265,245 265"/>
  <path class="edge" d="M375 95 L465 95"/>
  <path class="edge" d="M375 265 L465 265"/>
  <path class="edge" d="M575 95 C625 95,625 165,665 170"/>
  <path class="edge" d="M575 265 C625 265,625 195,665 190"/>
  <path class="edge" d="M770 180 L805 180"/>
</svg>
