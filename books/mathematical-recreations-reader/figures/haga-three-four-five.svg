<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-labelledby="title desc">
  <title id="title">Haga fold producing a three-four-five triangle</title>
  <desc id="desc">A square of side two has bottom-left point P folded to top midpoint Q. The crease meets the left side at E. With T the top-left corner, triangle E T Q has side lengths three quarters, one, and five quarters.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect x="12" y="12" width="616" height="416" rx="16" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <rect x="120" y="40" width="360" height="360" fill="#ffffff" stroke="#0f172a" stroke-width="4"/>
  <path d="M120 175 L480 355" fill="none" stroke="#dc2626" stroke-width="5"/>
  <path d="M120 175 L120 40 L300 40 Z" fill="#ccfbf1" stroke="#0f766e" stroke-width="4"/>
  <path d="M120 400 Q255 310 300 40" fill="none" stroke="#7c3aed" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
  <path d="M120 60 L140 60 L140 40" fill="none" stroke="#0f172a" stroke-width="3"/>
  <g fill="#0f172a" font-family="system-ui, sans-serif" font-size="20">
    <text x="92" y="34">T=(0,2)</text>
    <text x="286" y="32">Q=(1,2)</text>
    <text x="48" y="182">E=(0,5/4)</text>
    <text x="92" y="422">P=(0,0)</text>
    <text x="188" y="97" font-weight="700">|TQ|=1</text>
    <text x="26" y="116" font-weight="700">|ET|=3/4</text>
    <text x="175" y="153" font-weight="700">|EQ|=5/4</text>
    <text x="364" y="322" fill="#991b1b">crease x+2y=5/2</text>
    <text x="342" y="386" fill="#5b21b6">P folds to Q</text>
  </g>
  <circle cx="120" cy="400" r="7" fill="#7c3aed"/>
  <circle cx="300" cy="40" r="7" fill="#7c3aed"/>
  <circle cx="120" cy="175" r="7" fill="#dc2626"/>
</svg>
