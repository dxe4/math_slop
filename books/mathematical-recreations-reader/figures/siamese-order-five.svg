<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 580" role="img" aria-labelledby="title desc">
  <title id="title">First steps of the order-five Siamese magic-square construction</title>
  <desc id="desc">A five by five grid contains the completed order-five magic square. Cells containing one through five are highlighted as the first up-right run with wrap-around. Cell six is highlighted separately below cell five, showing the downward fallback after the attempted cell is occupied by one.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect x="12" y="12" width="676" height="556" rx="16" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <g font-family="system-ui, sans-serif" fill="#0f172a">
    <text x="350" y="46" text-anchor="middle" font-size="24" font-weight="700">Order 5: first run and blocked-cell fallback</text>
    <g font-size="18" text-anchor="middle">
      <text x="180" y="88">column 0</text><text x="270" y="88">1</text><text x="360" y="88">2</text><text x="450" y="88">3</text><text x="540" y="88">4</text>
      <text x="95" y="145">row 0</text><text x="95" y="235">1</text><text x="95" y="325">2</text><text x="95" y="415">3</text><text x="95" y="505">4</text>
    </g>
  </g>
  <rect x="135" y="100" width="450" height="450" fill="#ffffff" stroke="#0f172a" stroke-width="4"/>
  <g stroke="#64748b" stroke-width="2">
    <path d="M225 100V550 M315 100V550 M405 100V550 M495 100V550"/>
    <path d="M135 190H585 M135 280H585 M135 370H585 M135 460H585"/>
  </g>
  <g fill="#ccfbf1">
    <rect x="315" y="100" width="90" height="90"/>
    <rect x="405" y="460" width="90" height="90"/>
    <rect x="495" y="370" width="90" height="90"/>
    <rect x="135" y="280" width="90" height="90"/>
    <rect x="225" y="190" width="90" height="90"/>
  </g>
  <rect x="225" y="280" width="90" height="90" fill="#fef3c7"/>
  <g font-family="system-ui, sans-serif" font-size="27" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">
    <text x="180" y="145">17</text><text x="270" y="145">24</text><text x="360" y="145" font-weight="700">1</text><text x="450" y="145">8</text><text x="540" y="145">15</text>
    <text x="180" y="235">23</text><text x="270" y="235" font-weight="700">5</text><text x="360" y="235">7</text><text x="450" y="235">14</text><text x="540" y="235">16</text>
    <text x="180" y="325" font-weight="700">4</text><text x="270" y="325" font-weight="700">6</text><text x="360" y="325">13</text><text x="450" y="325">20</text><text x="540" y="325">22</text>
    <text x="180" y="415">10</text><text x="270" y="415">12</text><text x="360" y="415">19</text><text x="450" y="415">21</text><text x="540" y="415" font-weight="700">3</text>
    <text x="180" y="505">11</text><text x="270" y="505">18</text><text x="360" y="505">25</text><text x="450" y="505" font-weight="700">2</text><text x="540" y="505">9</text>
  </g>
  <path d="M270 252 L270 296" stroke="#7c3aed" stroke-width="5" marker-end="url(#arrow)"/>
  <g font-family="system-ui, sans-serif" font-size="17" fill="#0f172a">
    <text x="610" y="205" transform="rotate(90 610 205)" fill="#5b21b6">occupied target: move down</text>
    <text x="585" y="70" text-anchor="end" fill="#0f766e">teal: 1–5 up-right with wrap</text>
    <text x="130" y="70" fill="#92400e">gold: 6 after fallback</text>
  </g>
</svg>
