<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" aria-labelledby="title desc">
  <title id="title">Limiting parallels in the Poincare disk</title>
  <desc id="desc">Inside a unit-disk boundary, the horizontal diameter is a hyperbolic line. Two circular arcs through P equals zero comma one half are orthogonal to the boundary and miss the diameter in the open disk. The right arc shares the ideal endpoint plus one with the diameter and the left arc shares ideal endpoint minus one.</desc>
  <defs>
    <clipPath id="disk"><circle cx="300" cy="225" r="180"/></clipPath>
  </defs>
  <rect width="760" height="450" rx="16" fill="#fbfcfe"/>
  <circle cx="300" cy="225" r="180" fill="#eef6f8" stroke="#31596a" stroke-width="4"/>
  <g clip-path="url(#disk)">
    <line x1="112" y1="225" x2="488" y2="225" stroke="#273846" stroke-width="5"/>
    <circle cx="480" cy="0" r="225" fill="none" stroke="#a13d2d" stroke-width="6"/>
    <circle cx="120" cy="0" r="225" fill="none" stroke="#a13d2d" stroke-width="6"/>
  </g>
  <circle cx="300" cy="135" r="7" fill="#176b87"/>
  <circle cx="120" cy="225" r="6" fill="#fff" stroke="#a13d2d" stroke-width="3"/>
  <circle cx="480" cy="225" r="6" fill="#fff" stroke="#a13d2d" stroke-width="3"/>
  <g font-family="system-ui, sans-serif" fill="#273846">
    <text x="312" y="126" font-size="18" font-weight="650">P = (0, 1/2)</text>
    <text x="494" y="231" font-size="16">(1, 0), ideal</text>
    <text x="22" y="231" font-size="16">(−1, 0), ideal</text>
    <text x="500" y="205" font-size="18" font-style="italic">ℓ</text>
    <text x="528" y="75" font-size="18" fill="#a13d2d">limiting parallels</text>
    <text x="528" y="103" font-size="15">centers (±1, 5/4)</text>
    <text x="528" y="127" font-size="15">radius 5/4</text>
    <text x="250" y="424" font-size="15" fill="#31596a">unit circle is the ideal boundary</text>
  </g>
</svg>
