<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Integer solutions on a Diophantine line</title>
  <desc id="desc">A coordinate grid contains the line 2x plus 3y equals 6. Four highlighted integer points, minus 3 comma 4; 0 comma 2; 3 comma 0; and 6 comma minus 2, lie on it. An arrow from 0 comma 2 to 3 comma 0 is labelled primitive step 3 comma minus 2.</desc>
  <defs>
    <pattern id="grid" x="35" y="10" width="55" height="40" patternUnits="userSpaceOnUse">
      <path d="M 55 0 L 0 0 0 40" fill="none" stroke="#d7e1ea" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#a13d2d"/>
    </marker>
  </defs>
  <rect width="760" height="420" rx="16" fill="#fbfcfe"/>
  <rect x="90" y="50" width="605" height="320" fill="url(#grid)" stroke="#b8c7d3"/>
  <line x1="90" y1="250" x2="710" y2="250" stroke="#425466" stroke-width="2"/>
  <line x1="310" y1="380" x2="310" y2="36" stroke="#425466" stroke-width="2"/>
  <path d="M90 63.3 L695 356.7" fill="none" stroke="#176b87" stroke-width="5" stroke-linecap="round"/>
  <text x="510" y="192" fill="#176b87" font-family="system-ui, sans-serif" font-size="20" font-weight="650">2x + 3y = 6</text>
  <g fill="#fff" stroke="#176b87" stroke-width="4">
    <circle cx="145" cy="90" r="8"/>
    <circle cx="310" cy="170" r="8"/>
    <circle cx="475" cy="250" r="8"/>
    <circle cx="640" cy="330" r="8"/>
  </g>
  <circle cx="310" cy="170" r="12" fill="none" stroke="#a13d2d" stroke-width="3"/>
  <line x1="322" y1="176" x2="460" y2="243" stroke="#a13d2d" stroke-width="4" marker-end="url(#arrow)"/>
  <g fill="#273846" font-family="system-ui, sans-serif" font-size="16">
    <text x="112" y="78">(−3, 4)</text>
    <text x="326" y="157">base (0, 2)</text>
    <text x="484" y="274">(3, 0)</text>
    <text x="600" y="354">(6, −2)</text>
    <text x="345" y="218" fill="#8d3427" font-weight="650">primitive step (3, −2)</text>
    <text x="704" y="272" font-style="italic">x</text>
    <text x="291" y="40" font-style="italic">y</text>
  </g>
</svg>
